<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" fill="none">
  <defs>
    <linearGradient id="bg" x1="12" y1="12" x2="116" y2="116" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>
    <linearGradient id="edge" x1="28" y1="28" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Rounded dark background with ~10% outer padding -->
  <rect x="12" y="12" width="104" height="104" rx="24" fill="url(#bg)" stroke="#334155" stroke-width="2"/>

  <!-- Directed AST / Call Graph Edges -->
  <g stroke="url(#edge)" stroke-width="3.5" stroke-linecap="round" filter="url(#glow)">
    <line x1="64" y1="36" x2="38" y2="64"/>
    <line x1="64" y1="36" x2="90" y2="64"/>
    <line x1="38" y1="64" x2="64" y2="92"/>
    <line x1="90" y1="64" x2="64" y2="92"/>
    <line x1="38" y1="64" x2="90" y2="64" stroke-dasharray="5 5" stroke-width="2.5"/>
  </g>

  <!-- Graph Nodes -->
  <g filter="url(#glow)">
    <circle cx="64" cy="36" r="10" fill="#0F172A" stroke="#38BDF8" stroke-width="4"/>
    <circle cx="38" cy="64" r="9" fill="#0F172A" stroke="#818CF8" stroke-width="4"/>
    <circle cx="90" cy="64" r="9" fill="#0F172A" stroke="#A78BFA" stroke-width="4"/>
    <circle cx="64" cy="92" r="10" fill="#0F172A" stroke="#34D399" stroke-width="4"/>

    <circle cx="64" cy="36" r="3.5" fill="#38BDF8"/>
    <circle cx="38" cy="64" r="3" fill="#818CF8"/>
    <circle cx="90" cy="64" r="3" fill="#A78BFA"/>
    <circle cx="64" cy="92" r="3.5" fill="#34D399"/>
  </g>
</svg>
